<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weekly Updates | Economics Microsite</title>
  <link rel="stylesheet" href="weekly.css?v=20261104-white">
  <script src="weekly.js?v=20261104-white" defer></script>
</head>
<body>
  <main>
    <p id="status" role="status" aria-live="polite">Loading weekly updates...</p>
    <details id="review" hidden>
      <summary>Local review queue</summary>
      <p>Drafts stay private until approved. Check the date, tags, PDF, and chart previews.</p>
      <div id="drafts"></div>
    </details>
    <section id="latest" aria-labelledby="issue-heading" hidden>
      <h2 id="issue-heading">Latest issue</h2>
      <div id="latest-details"></div>
      <div id="pdf" role="region" aria-label="Weekly update preview" tabindex="0"></div>
      <h2 class="charts-heading">Charts</h2>
      <div id="charts" class="chart-strip"></div>
    </section>
    <details id="archive">
      <summary>Archive</summary>
      <label>Filter by indicator <select id="indicator"><option value="">All indicators</option></select></label>
      <div id="archive-list"></div>
    </details>
  </main>
</body>
</html>
