<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weekly Updates | Economics Microsite</title>
  <link rel="stylesheet" href="weekly.css?v=20261105-calendar-button">
  <script src="calendar.js?v=20261105-calendar-selected" defer></script>
  <script src="weekly.js?v=20261105-calendar" defer></script>
</head>
<body>
  <main>
    <p id="status" role="status" aria-live="polite">Loading weekly updates...</p>
    <details id="review" hidden>
      <summary>Local review queue</summary>
      <p>Drafts stay private until approved. Check the date, tags, PDF, and chart previews.</p>
      <div id="drafts"></div>
    </details>
    <section id="latest" aria-labelledby="issue-heading" hidden>
      <div id="latest-details">
        <div>
          <h2 id="issue-heading">Latest issue</h2>
          <p class="issue-description">A weekly briefing on US economic data released during the previous week.</p>
          <h3 id="issue-date"></h3>
        </div>
        <div class="issue-tools">
          <button id="open-calendar" type="button" aria-haspopup="dialog" aria-controls="calendar-dialog">Data Release Calendar</button>
          <div id="pdf-download"></div>
        </div>
      </div>
      <div id="pdf" role="region" aria-label="Weekly update preview" tabindex="0"></div>
      <h2 class="charts-heading">Charts</h2>
      <div id="charts" class="chart-strip"></div>
    </section>
    <details id="archive">
      <summary>Archive</summary>
      <label>Filter by indicator <select id="indicator"><option value="">All indicators</option></select></label>
      <div id="archive-list"></div>
    </details>
  </main>
  <dialog id="calendar-dialog" aria-label="Data Release Calendar">
    <div class="calendar-dialog-actions">
      <button id="close-calendar" type="button" autofocus>Close</button>
    </div>
    <div id="release-calendar"><p>Loading release calendar...</p></div>
  </dialog>
  <dialog id="chart-dialog" aria-labelledby="chart-large-title">
    <div class="chart-dialog-head">
      <h2 id="chart-large-title"></h2>
      <button id="close-chart" type="button" autofocus>Close</button>
    </div>
    <img id="chart-large" alt="">
    <p id="chart-preview-status" role="status" hidden></p>
    <a id="chart-large-download">Download PNG</a>
  </dialog>
</body>
</html>
