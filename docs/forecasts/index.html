<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Economic Forecasts</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", Arial, sans-serif; background: #141c19; color: #edf4f0; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 38px clamp(20px, 5vw, 72px); }
    main { max-width: 1280px; margin: 0 auto; }
    p { color: #a0b0a8; font-size: 14px; line-height: 1.6; }
    h1 { margin: 0; color: #edf4f0; font: 400 clamp(32px, 5vw, 48px)/1.1 Georgia, serif; }
    .eyebrow { margin: 0 0 12px; color: #43c5ca; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .intro { max-width: 720px; margin-bottom: 30px; }
    .workspace { min-height: 280px; border: 1px solid #2a3932; border-radius: 12px; background: #19221f; padding: 24px; }
    .workspace h2 { margin: 0; color: #edf4f0; font: 400 24px/1.2 Georgia, serif; }
    .workspace p { margin: 10px 0 0; }
  </style>
</head>
<body>
  <main>
    <header class="intro">
      <p class="eyebrow">United States | Outlook</p>
      <h1>Economic Forecasts</h1>
      <p>Forecast content will be developed in this section.</p>
    </header>
    <section class="workspace" aria-labelledby="forecast-workspace-title">
      <h2 id="forecast-workspace-title">Forecast workspace</h2>
      <p>This section is ready for forecast materials.</p>
    </section>
  </main>
</body>
</html>
